# Plesk Node.js startup file: server.mjs
# (Application root is the frontend folder, Node 22.)
# That file sets Cache-Control before the Astro server writes its own header:
#   /_astro/   public, max-age=31536000, immutable
#   /images/   public, max-age=2592000
#   /fonts/    public, max-age=2592000
#
# Also turn gzip on for HTML, CSS, and JavaScript if it is not already.
# Plesk often enables this for the domain. These lines belong in the same
# Additional nginx directives box.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

location ^~ /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /images/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
}

location ^~ /fonts/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
}

# Gzip HTML, CSS, and JavaScript if the domain does not already compress them.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
