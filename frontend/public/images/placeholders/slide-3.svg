<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071924"/>
      <stop offset="50%" stop-color="#0a2a30"/>
      <stop offset="100%" stop-color="#030d12"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid3" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow3" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="800" fill="url(#bg3)"/>
  <rect width="1920" height="800" fill="url(#grid3)"/>
  <circle cx="960" cy="400" r="550" fill="url(#glow3)"/>

  <circle cx="280" cy="260" r="150" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="2" stroke-dasharray="10 8"/>
  <circle cx="1700" cy="500" r="230" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-width="2" stroke-dasharray="8 6"/>

